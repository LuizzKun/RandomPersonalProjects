<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="quiz-container">
      <h1>JavaScript Quiz</h1>

      <section class="questions">
        <h2 class="question">What does querySelector() do?</h2>
        <div class="answers">
          <button class="answer">A. Creates an HTML element</button>
          <button class="answer correct-answer">B. Selects an element from the page</button>
          <!--This is answer -->
          <button class="answer">C. Deletes an element</button>
          <button class="answer">D. Changes the page color</button>
        </div>
      </section>

      <nav class="navigation-bar">
        <button class="prev nav-btn">Previous</button>
        <p class="question-counter">Question 1 of <span class="numQuestions"> 10 </span></p>
        <button class="next nav-btn">Next</button>
      </nav>
    </main>

    <script src="app.js"></script>
  </body>
</html>
